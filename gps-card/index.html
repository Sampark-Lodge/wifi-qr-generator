  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f0f;
      --card-bg: #1a1a1a;
      --input-bg: #2a2a2a;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --text: #ffffff;
      --text-muted: #888888;
      --border: #333333;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 8px;
    }

    .form-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 14px 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #555;
    }

    .field textarea {
      resize: vertical;
      min-height: 60px;
      font-family: 'Outfit', sans-serif;
    }

    .field-row {
      display: flex;
      gap: 12px;
    }

    .field-row .field {
      flex: 1;
    }

    .qrcode-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .qrcode-wrapper {
      display: inline-block;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
    }

    #qrcode {
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img {
      display: block;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 14px;
      padding: 60px;
    }

    .card-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      margin-bottom: 24px;
    }

    .card-section h2 {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .location-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .location-icon svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
    }

    .card-place-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .card-address {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .card-divider {
      width: 40px;
      height: 2px;
      background: var(--border);
      margin: 0 auto 20px;
      border-radius: 1px;
    }

    .card-coords {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    .card-coord-item {
      text-align: center;
    }

    .card-coord-item .coord-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .card-coord-item .coord-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      margin-top: 4px;
    }

    .open-maps-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--accent);
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .open-maps-btn:hover {
      opacity: 0.85;
    }

    .open-maps-btn svg {
      width: 16px;
      height: 16px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .btn {
      flex: 1;
      padding: 14px 24px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 20px 0;
    }

    .footer svg {
      display: inline;
      vertical-align: middle;
      width: 14px;
      height: 14px;
      margin-right: 4px;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
        margin: 0;
      }
      .header,
      .form-section,
      .qrcode-section,
      .actions,
      .footer {
        display: none !important;
      }

      .card-section {
        background: #fff;
        border: 2px solid #000;
        border-radius: 8px;
        padding: 24px;
        margin: 20mm auto;
        max-width: 320px;
        page-break-inside: avoid;
        box-shadow: none;
      }

      .card-section h2 {
        color: #666;
      }
      .card-place-name {
        color: #000;
      }
      .card-address {
        color: #555;
      }
      .card-coord-item .coord-value {
        color: #b45309;
      }
      .location-icon {
        background: rgba(245, 158, 11, 0.08);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }
      .header h1 {
        font-size: 24px;
      }
      .form-section {
        padding: 20px;
      }
      .form-section,
      .card-section {
        padding: 20px;
      }
      .field-row {
        flex-direction: column;
        gap: 0;
      }
      .card-coords {
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📍 GPS Card</h1>
      <p>Create a printable directions card with a QR code</p>
    </div>

    <div class="form-section">
      <div class="field">
        <label for="placeName">Place Name</label>
        <input type="text" id="placeName" placeholder="Sampark Lodge" autocomplete="off">
      </div>
      <div class="field">
        <label for="address">Address</label>
        <textarea id="address" placeholder="123 Main Street, City, State, ZIP" rows="2"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="latitude">Latitude</label>
          <input type="text" id="latitude" placeholder="12.3456">
        </div>
        <div class="field">
          <label for="longitude">Longitude</label>
          <input type="text" id="longitude" placeholder="78.9012">
        </div>
      </div>
    </div>

    <div class="qrcode-section" id="qrSection">
      <div class="qrcode-wrapper">
        <div id="qrcode">
          <div class="placeholder-text">Enter a place name &amp; address<br>to generate your GPS card</div>
        </div>
      </div>
    </div>

    <div class="card-section" id="cardSection">
      <h2>Directions Card</h2>
      <div class="location-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <div class="card-place-name" id="cardPlaceName">—</div>
      <div class="card-address" id="cardAddress">—</div>
      <div class="card-divider"></div>
      <div class="card-coords">
        <div class="card-coord-item">
          <div class="coord-label">Lat</div>
          <div class="coord-value" id="cardLat">—</div>
        </div>
        <div class="card-coord-item">
          <div class="coord-label">Lng</div>
          <div class="coord-value" id="cardLng">—</div>
        </div>
      </div>
      <a class="open-maps-btn" id="mapsLink" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Open in Google Maps
      </a>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="printBtn">🖨️ Print Card</button>
      <button class="btn btn-secondary" id="downloadBtn">⬇️ Download QR</button>
    </div>

    <div class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      All processing happens in your browser. No data stored.
      <br>
      <a href="https://sampark-lodge.github.io/wifi-qr-generator/">WiFi QR Generator</a> ·
      <a href="https://sampark-lodge.github.io/wifi-qr-generator/vcard-qr/">vCard QR</a>
    </div>
  </div>

  <script>
    let qrCodeInstance = null;

    const inputs = ['placeName', 'address', 'latitude', 'longitude'];

    inputs.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', updateCard);
      }
    });

    function buildMapsUrl() {
      const address = document.getElementById('address').value.trim();
      const lat = document.getElementById('latitude').value.trim();
      const lng = document.getElementById('longitude').value.trim();

      // Prefer lat/lng if both provided
      if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
        return `https://maps.google.com/maps?q=${lat},${lng}`;
      }

      // Fall back to address query
      if (address) {
        return `https://maps.google.com/maps?q=${encodeURIComponent(address)}`;
      }

      return '';
    }

    function hasAnyInput() {
      return inputs.some(id => {
        const el = document.getElementById(id);
        return el && el.value.trim().length > 0;
      });
    }

    function updateCard() {
      const placeName = document.getElementById('placeName').value.trim() || '—';
      const address = document.getElementById('address').value.trim() || '—';
      const lat = document.getElementById('latitude').value.trim();
      const lng = document.getElementById('longitude').value.trim();

      document.getElementById('cardPlaceName').textContent = placeName;
      document.getElementById('cardAddress').textContent = address;
      document.getElementById('cardLat').textContent = lat && !isNaN(lat) ? lat : '—';
      document.getElementById('cardLng').textContent = lng && !isNaN(lng) ? lng : '—';

      // Update maps link
      const mapsUrl = buildMapsUrl();
      const mapsLink = document.getElementById('mapsLink');
      if (mapsUrl) {
        mapsLink.href = mapsUrl;
        mapsLink.style.display = 'inline-flex';
      } else {
        mapsLink.href = '#';
        mapsLink.style.display = 'inline-flex';
        mapsLink.style.opacity = '0.4';
      }

      regenerateQR();
    }

    function regenerateQR() {
      const qrContainer = document.getElementById('qrcode');
      const mapsUrl = buildMapsUrl();

      if (!mapsUrl) {
        qrContainer.innerHTML = '<div class="placeholder-text">Enter a place name &amp; address<br>to generate your GPS card</div>';
        return;
      }

      qrContainer.innerHTML = '';
      const qrSize = Math.min(260, window.innerWidth - 80);

      try {
        qrCodeInstance = new QRCode(qrContainer, {
          text: mapsUrl,
          width: qrSize,
          height: qrSize,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch (e) {
        qrContainer.innerHTML = '<div class="placeholder-text">Error generating QR</div>';
      }
    }

    document.getElementById('printBtn').addEventListener('click', () => {
      window.print();
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const img = document.querySelector('#qrcode img');
      if (img) {
        const link = document.createElement('a');
        link.download = 'gps-card-qr.png';
        link.href = img.src;
        link.click();
      } else {
        alert('Generate a QR code first by entering a location.');
      }
    });

    // Initial render
    updateCard();
  </script>
</body>
</html>
